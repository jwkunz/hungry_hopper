name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version files agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check VERSION, web/package.json and (for a release) the tag
        run: node scripts/version.mjs check "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

  web:
    name: Tests and single-file build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the build is one self-contained file
        run: |
          test "$(ls dist/hungry_hopper-v*.html | wc -l)" = 1
          ! grep -E '<script[^>]+src=|<link[^>]+href=' dist/hungry_hopper-v*.html
      - run: cp dist/hungry_hopper-v*.html "$RUNNER_TEMP/hungry_hopper.html"
      - uses: actions/upload-artifact@v4
        with:
          name: hungry-hopper-html
          path: ${{ runner.temp }}/hungry_hopper.html
          if-no-files-found: error

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK (Gradle builds the web page the app bundles)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: Android
      - name: Check the APK bundles the game page at assets/index.html
        run: unzip -l Android/app/build/outputs/apk/release/app-release*.apk | grep -E ' assets/index.html$'
      - name: Collect the APK and check its signature
        run: |
          apk=$(ls Android/app/build/outputs/apk/release/app-release*.apk)
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          fi
          cp "$apk" "$RUNNER_TEMP/hungry-hopper.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hungry-hopper-apk
          path: ${{ runner.temp }}/hungry-hopper.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # On a v* tag, or on main when VERSION has no release yet (the tag is created by the release itself).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [version, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          mv artifacts/hungry_hopper.html "hungry-hopper-$TAG.html"
          mv artifacts/hungry-hopper.apk "hungry-hopper-$TAG.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hungry Hopper $TAG" --generate-notes \
            "hungry-hopper-$TAG.html#Hungry Hopper (single HTML file)" \
            "hungry-hopper-$TAG.apk#Hungry Hopper (Android APK)"
