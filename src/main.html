<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>A game</title>
    <script src="./libs/math.js" type="text/javascript"></script>
    <script src="scene.js" type="text/javascript"></script>
    <script src="sprite.js" type="text/javascript"></script>
    <script src="physics_engine.js" type="text/javascript"></script>
    <script src="frog.js" type="text/javascript"></script>
    <script src="game_engine.js" type="text/javascript"></script>
    <script src="ui.js" type="text/javascript"></script>
    <style>

    </style>
</head>

<body>
    <script type="text/javascript">

        let GM = [] // Global game memory

        GM.frog_push_f = 2000
        GM.frog_f_jump = 60000
        GM.frog_g_jump = 1000
        GM.frog_drag_jump = 0.1
        GM.frog_drag_walk = 5.0
        GM.frog_mass = 1.0
        GM.frog_scale = 0.3

        function init_all(){
            div = document.createElement("div")
            document.body.appendChild(div)
     
            viewport_width = math.round(window.innerWidth * 0.9)
			viewport_height = math.round(window.innerHeight * 0.75)
			GM.main_scene = new scene(
                html_host_element = div,
                list_of_sprites = [new frog(viewport_width/2,0,GM.frog_scale)],
                width = viewport_width,
                height = viewport_height,
                background = "#000000"
            )   
            GM.main_scene.sprites[0].set_on_y(viewport_height*0.99)

            init_controls()


        }

        window.onload = function(){
            init_all()
            GM.last_timestamp = 0
            GM.elapsed = 0
            window.requestAnimationFrame(game_loop)
        }
        
        
    </script>
</body>
