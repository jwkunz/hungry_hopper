<!DOCTYPE html>

<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<title>Bouncy</title>
	<script src="./libs/math/math.js"></script>
	<script src="./lib/plotly/plotly-1.35.2.min.js"></script>
	<style></style>
	<style>

	</style>

</head>

<body data-new-gr-c-s-check-loaded="14.1040.0" data-gr-ext-installed="">
	<div>
		<canvas id="viewport" width="1920" height="703">&gt;
			<img id="mario" width="300" height="300" src="..\media\sprites\mario\mario_sprites.png">
		</canvas>
		<button id="button_up" onclick="move_obj(box_1,0,-1)"
			style="position: absolute; left: 912px; top: 751px; width: 96px; height: 48px;"> Up</button>
		<button id="button_left" onclick="move_obj(box_1,-1,0)"
			style="position: absolute; left: 864px; top: 799px; width: 96px; height: 48px;"> Left</button>
		<button id="button_right" onclick="move_obj(box_1,1,0)"
			style="position: absolute; left: 960px; top: 799px; width: 96px; height: 48px;"> Right</button>
		<button id="button_down" onclick="move_obj(box_1,0,1)"
			style="position: absolute; left: 912px; top: 847px; width: 96px; height: 48px;"> Down</button>
	</div>



	<script>

		var globals = {
			background: "grey",
			canvas_width: 400,
			canvas_height: 300,
			button_height: 20,
			button_width: 100,
			button_move_scale: 20,
			button_impulse_scale: 15,
			draw_ms: 25,
			physics_drag: 0.001,
			physics_friction: 0.4,
			physics_bounce: 0.6,
			physics_gravity: 1.0,
			hit_sound_speed: 5,
			squash_sound_speed: 20,
		}

		var box_1 = {
			type: "box",
			color: "red",
			width: 20,
			height: 20,
			p_x: 100,
			p_y: 100,
			v_x: 10,
			v_y: 5,
			a_x: 0,
			a_y: 0
		}

		var mario_sprite = {
			type: "sprite",
			image_id: "mario",
			states: {
				right: {
					s_x: 1500,
					s_y: 0,
					s_width: 1500,
					s_height: 1856
				},
				left: {
					s_x: 0,
					s_y: 0,
					s_width: 1500,
					s_height: 1856
				}
			},
			current_state: "",
			width: 50,
			height: 50,
			p_x: 100,
			p_y: 100,
			v_x: 10,
			v_y: 5,
			a_x: 0,
			a_y: 0
		}

		function init_all() {
			// Window size

			globals.canvas_width = math.round(window.innerWidth)
			globals.canvas_height = math.round(window.innerHeight * 0.75)

			// Size calculations

			largest_dim = math.max(globals.canvas_width, globals.canvas_height)
			globals.button_width = math.round(largest_dim / 20)
			globals.button_height = math.round(globals.button_width / 2)
			box_1.width = math.round(largest_dim / 50)
			box_1.height = math.round(largest_dim / 50)

			// Background

			document.getElementById("viewport").setAttribute('width', globals.canvas_width)
			document.getElementById("viewport").setAttribute('height', globals.canvas_height)

			draw_obj({ color: globals.background, type: "box", p_x: 0, p_y: 0, width: globals.canvas_width, height: globals.canvas_height })

			// Buttons

			document.getElementById("button_up").style.position = "absolute"
			document.getElementById("button_up").style.left = (globals.canvas_width / 2 - globals.button_width / 2).toString() + 'px'
			document.getElementById("button_up").style.top = (globals.canvas_height + globals.button_height).toString() + 'px'
			document.getElementById("button_up").style.width = (globals.button_width).toString() + 'px'
			document.getElementById("button_up").style.height = (globals.button_height).toString() + 'px'
			document.getElementById("button_up").setAttribute('onclick', "bounce_sound(); move_obj(mario_sprite,0,-1)")

			document.getElementById("button_left").style.position = "absolute"
			document.getElementById("button_left").style.left = (globals.canvas_width / 2 - globals.button_width).toString() + 'px'
			document.getElementById("button_left").style.top = (globals.canvas_height + 2 * globals.button_height).toString() + 'px'
			document.getElementById("button_left").style.width = (globals.button_width).toString() + 'px'
			document.getElementById("button_left").style.height = (globals.button_height).toString() + 'px'
			document.getElementById("button_left").setAttribute('onclick', "move_obj(mario_sprite,-1,0)")

			document.getElementById("button_right").style.position = "absolute"
			document.getElementById("button_right").style.left = (globals.canvas_width / 2).toString() + 'px'
			document.getElementById("button_right").style.top = (globals.canvas_height + 2 * globals.button_height).toString() + 'px'
			document.getElementById("button_right").style.width = (globals.button_width).toString() + 'px'
			document.getElementById("button_right").style.height = (globals.button_height).toString() + 'px'
			document.getElementById("button_right").setAttribute('onclick', "move_obj(mario_sprite,1,0)")

			document.getElementById("button_down").style.position = "absolute"
			document.getElementById("button_down").style.left = (globals.canvas_width / 2 - globals.button_width / 2).toString() + 'px'
			document.getElementById("button_down").style.top = (globals.canvas_height + 3 * globals.button_height).toString() + 'px'
			document.getElementById("button_down").style.width = (globals.button_width).toString() + 'px'
			document.getElementById("button_down").style.height = (globals.button_height).toString() + 'px'
			document.getElementById("button_down").setAttribute('onclick', "move_obj(mario_sprite,0,1)")

			// Mario Sprite
			mario_sprite.current_state = mario_sprite.states.right
			draw_obj(mario_sprite)

			// Bounce sound
			this.sound_boing = document.createElement("audio")
			this.sound_boing.src = "../media/sounds/boing.wav"
			this.sound_boing.setAttribute("preload", "auto");
			this.sound_boing.style.display = "none";
			document.body.appendChild(this.sound_boing);

			// Splat sound
			this.sound_splat = document.createElement("audio")
			this.sound_splat.src = "../media/sounds/splat.wav"
			this.sound_splat.setAttribute("preload", "auto");
			this.sound_splat.style.display = "none";
			document.body.appendChild(this.sound_splat);
			
			// Hit sound
			this.sound_hit = document.createElement("audio")
			this.sound_hit.src = "../media/sounds/hit.wav"
			this.sound_hit.setAttribute("preload", "auto");
			this.sound_hit.style.display = "none";
			document.body.appendChild(this.sound_hit);			

			// Physics 
			setInterval(physics_obj, globals.draw_ms, mario_sprite)
		}

		function bounce_sound(){
			this.sound_boing.play()
		}

		function splat_sound(){
			this.sound_splat.play()
		}	
		
		function hit_sound(){
			this.sound_hit.play()
		}			

		function draw_obj(arg) {
			var canvas = document.getElementById("viewport");
			var ctx = canvas.getContext("2d");
			if (arg.type == "box") {
				ctx.fillStyle = arg.color;
				ctx.fillRect(arg.p_x, arg.p_y, arg.width, arg.height);
			} else {
				var img = document.getElementById(arg.image_id)
				ctx.drawImage(img, arg.current_state.s_x, arg.current_state.s_y, arg.current_state.s_width, arg.current_state.s_height, arg.p_x, arg.p_y, arg.width, arg.height);
			}

		}

		function erase_obj(arg) {
			var canvas = document.getElementById("viewport");
			var ctx = canvas.getContext("2d");
			ctx.fillStyle = globals.background;
			ctx.fillRect(arg.p_x, arg.p_y, arg.width, arg.height);
		}

		function move_obj(arg, dx, dy) {
			erase_obj(arg)
			arg.p_x += dx * globals.button_move_scale
			arg.p_y += dy * globals.button_move_scale
			arg.v_x += math.round(dx * globals.button_impulse_scale)
			arg.v_y += math.round(dy * globals.button_impulse_scale)
			draw_obj(arg)
		}

		function physics_obj(arg) {
			erase_obj(arg)

			a_y = arg.a_y + globals.physics_gravity - math.sign(arg.v_y) * math.round(globals.physics_drag * arg.v_y ** 2)
			a_x = arg.a_x - math.sign(arg.v_x) * math.round(globals.physics_drag * arg.v_x ** 2)

			let v_x_prior = arg.v_x;

			arg.v_y += a_y
			arg.v_x += a_x
			arg.p_x += arg.v_x
			arg.p_y += arg.v_y

			if (arg.p_x + arg.width > globals.canvas_width) {
				if(arg.v_x > globals.hit_sound_speed){
					hit_sound()
				}

				arg.p_x = globals.canvas_width - arg.width
				arg.v_x = -math.round(arg.v_x * globals.physics_bounce)
				arg.v_y = math.round(arg.v_y * globals.physics_friction)
			}
			if (arg.p_x < 0) {
				if(arg.v_x < -globals.hit_sound_speed){
					hit_sound()
				}

				arg.p_x = 0
				arg.v_x = -math.round(arg.v_x * globals.physics_bounce)
				arg.v_y = math.round(arg.v_y * globals.physics_friction)
			}

			if (arg.p_y + arg.height > globals.canvas_height) {
				if(arg.v_y > globals.squash_sound_speed){
					splat_sound()
				}

				arg.p_y = globals.canvas_height - arg.height
				arg.v_y = -math.round(arg.v_y * globals.physics_bounce)
				arg.v_x = math.round(arg.v_x * globals.physics_friction)
			}
			if (arg.p_y < 0) {

				if(arg.v_y < -globals.hit_sound_speed){
					hit_sound()
				}

				arg.p_y = 0
				arg.v_y = -math.round(arg.v_y * globals.physics_bounce)
				arg.v_x = math.round(arg.v_x * globals.physics_friction)
			}

			if (arg.v_x < 0) {
				arg.current_state = arg.states.left
			}
			if (arg.v_x > 0) {
				arg.current_state = arg.states.right
			}

			draw_obj(arg)
		}

		init_all()

	</script>




</body>
<grammarly-desktop-integration data-grammarly-shadow-root="true"></grammarly-desktop-integration>

</html>
