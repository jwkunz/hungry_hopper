<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>A game</title>
    <script src="./libs/math.js" type="text/javascript"></script>
    <script src="viewport.js" type="text/javascript"></script>
    <script src="sprite.js" type="text/javascript"></script>
    <script src="tongue.js" type="text/javascript"></script>
    <script src="frog.js" type="text/javascript"></script>
    
    <style>

    </style>

<body>
    <script type="text/javascript">

        let vp = []
        function init_all(){
            div = document.createElement("div")
            document.body.appendChild(div)
     
            viewport_width = math.round(window.innerWidth)
			viewport_height = math.round(window.innerHeight * 0.75)
			largest_dim = math.max(viewport_width, viewport_height)
            vp = new viewport(
                html_host_element = div,
                list_of_sprites = [new frog(
                    0,0,0.5,0
                )],
                width = viewport_width,
                height = viewport_height,
                background = "#FF0000"
            )   

        }

        window.onload = function(){
            vp.draw()
        }
        
        init_all()
    </script>
</body>
